
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password | Student Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/student-style.css" rel="stylesheet">
</head>
<body class="student-dashboard-page">

  <nav class="student-navbar">
    <div class="nav-brand">
      <div class="nav-logo">SE</div>
      <div>
        <strong>Student Portal</strong>
        <small>Software Engineering Department</small>
      </div>
    </div>
    <a href="student-dashboard.html" class="btn btn-outline-light btn-sm">Dashboard</a>
  </nav>

  <main class="dashboard-container">
    <section class="welcome-panel">
      <div>
        <p class="welcome-eyebrow">ACCOUNT SECURITY</p>
        <h1>Change Password</h1>
        <p>Keep your student account secure.</p>
      </div>
      <div class="welcome-avatar">🔐</div>
    </section>

    <div id="passwordMessage" aria-live="polite"></div>

    <section class="student-info-card password-card">
      <div class="section-heading">
        <div>
          <h2>Update Your Password</h2>
          <p>Choose a strong password that you have not used before.</p>
        </div>
      </div>

      <form id="changePasswordForm">
        <div class="mb-3">
          <label for="newPassword" class="form-label">New Password</label>
          <input type="password" id="newPassword" class="form-control"
                 minlength="8" autocomplete="new-password" required>
          <small class="text-muted">Use at least 8 characters.</small>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="form-control"
                 minlength="8" autocomplete="new-password" required>
        </div>

        <button type="submit" id="changePasswordBtn" class="btn btn-primary">
          Update Password
        </button>
      </form>
    </section>
  </main>

  <script type="module" src="js/student-password.js"></script>
</body>
</html>
