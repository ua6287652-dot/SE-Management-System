
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Set New Password | Student Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/student-style.css" rel="stylesheet">
</head>
<body class="student-auth-page">

  <main class="auth-card password-reset-card">
    <div class="auth-brand">
      <div class="brand-logo">SE</div>
      <h2>Student Portal</h2>
      <p>Software Engineering Department</p>
    </div>

    <div class="auth-content">
      <h3>Set New Password</h3>
      <p>Enter and confirm your new password.</p>

      <div id="newPasswordMessage" aria-live="polite"></div>

      <form id="resetPasswordForm">
        <div class="mb-3">
          <label for="newPassword" class="form-label">New Password</label>
          <input type="password" id="newPassword" class="form-control"
                 minlength="8" autocomplete="new-password" required>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control"
                 minlength="8" autocomplete="new-password" required>
        </div>

        <button type="submit" id="saveNewPasswordBtn" class="btn btn-primary w-100">
          Save New Password
        </button>
      </form>

      <div class="auth-links mt-4">
        <a href="student-login.html">Back to Student Login</a>
      </div>
    </div>
  </main>

  <script type="module" src="js/student-reset-password.js"></script>
</body>
</html>
