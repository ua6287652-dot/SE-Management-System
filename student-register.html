
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Registration | SE Department</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/student-style.css" rel="stylesheet">
</head>
<body class="student-auth-page">

  <main class="auth-card">
    <div class="auth-brand">
      <div class="brand-logo">SE</div>
      <h1>Student Portal</h1>
      <p>Software Engineering Department</p>
    </div>

    <div class="auth-content">
      <h2>Create Your Account</h2>
      <p class="muted-text">
        Register using the email and roll number already provided by your department.
      </p>

      <div id="authMessage" aria-live="polite"></div>

      <form id="studentRegisterForm">
        <div class="mb-3">
          <label for="rollNo" class="form-label">University Roll Number</label>
          <input
            type="text"
            id="rollNo"
            class="form-control"
            placeholder="Enter your existing roll number"
            required>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Registered Email Address</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="Enter the email registered with department"
            autocomplete="email"
            required>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Create Password</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="At least 8 characters"
            autocomplete="new-password"
            minlength="8"
            required>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            placeholder="Enter password again"
            autocomplete="new-password"
            minlength="8"
            required>
        </div>

        <button type="submit" id="registerBtn" class="btn auth-btn w-100">
          Create Student Account
        </button>
      </form>

      <p class="auth-switch">
        Already have an account?
        <a href="student-login.html">Student Login</a>
      </p>

      <p class="auth-bottom">
        <a href="login.html">Administrator Login</a>
      </p>
    </div>
  </main>

  <script type="module" src="js/student-auth.js"></script>
</body>
</html>
