
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot Password | Student Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/student-style.css" rel="stylesheet">
</head>
<body class="student-auth-page">

  <main class="auth-card password-reset-card">
    <div class="auth-brand">
      <div class="brand-logo">SE</div>
      <h2>Student Portal</h2>
      <p>Software Engineering Department</p>
    </div>

    <div class="auth-content">
      <h3>Forgot Password?</h3>
      <p>Enter your registered student email. We will send you a password reset link.</p>

      <div id="resetMessage" aria-live="polite"></div>

      <form id="forgotPasswordForm">
        <div class="mb-3">
          <label for="resetEmail" class="form-label">Registered Email</label>
          <input type="email" id="resetEmail" class="form-control"
                 placeholder="student@example.com" autocomplete="email" required>
        </div>

        <button type="submit" id="resetButton" class="btn btn-primary w-100">
          Send Reset Link
        </button>
      </form>

      <div class="auth-links mt-4">
        <a href="student-login.html">Back to Student Login</a>
      </div>
    </div>
  </main>

  <script type="module" src="js/student-forgot-password.js"></script>
</body>
</html>
